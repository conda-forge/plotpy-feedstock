schema_version: 1

context:
  name: plotpy
  version: "2.10.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/plotpy-${{ version }}.tar.gz
  sha256: be14e2e507eb70908e3199544d9f8107a99c30cb5c3961a0ac54269d553ec87b

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - if: build_platform != host_platform
      then:
        - cross-python_${{ host_platform }}
        - python
        - cython
        - numpy
  host:
    - python
    - setuptools
    - wheel
    - numpy
    - cython
    - pip
  run:
    - python
    - guidata >=3.14.1
    - pythonqwt >=0.16
    - scipy >=1.7.3
    - scikit-image >=0.19
    - pillow
    - tifffile
    - qtpy

tests:
  - python:
      imports:
        - plotpy
      pip_check: true
  - requirements:
      run:
        - pytest
        # Running pytest requires PyQt5, PyQt6 or PySide6 to be installed
        - pyside6
        - if: linux
          then: pytest-xvfb
    script:
      - if: win
        then: set QT_QPA_PLATFORM=offscreen && pytest --collect-only --pyargs plotpy.tests
        else: QT_QPA_PLATFORM=offscreen pytest --collect-only --pyargs plotpy.tests
about:
  summary: Curve and image plotting tools for Python/Qt applications
  description: |
    PlotPy is is a Python library providing efficient 2D data-plotting features for interactive computing and signal/image processing application development.
    It is part of the PlotPyStack project, aiming at providing a unified framework for creating scientific GUIs with Python and Qt.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/PlotPyStack/PlotPy
  documentation: https://plotpy.readthedocs.io/

extra:
  recipe-maintainers:
    - PierreRaybaut
